name: JustRunMy-renew

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 🐍 Python 依赖缓存
      # -----------------------------
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      # -----------------------------
      # 🧰 Playwright 浏览器缓存
      # -----------------------------
      - name: 🧰 Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # -----------------------------
      # 🧰 Chrome / Chromedriver 缓存
      # -----------------------------
      - name: 🧰 Cache Chrome & Chromedriver
        uses: actions/cache@v4
        with:
          path: |
            /usr/bin/google-chrome
            ~/.cache/seleniumbase
          key: chrome-${{ runner.os }}
          restore-keys: |
            chrome-${{ runner.os }}

      # -----------------------------
      # 🛠️ 安装系统依赖
      # -----------------------------
      - name: 🛠️ Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils xdotool scrot fonts-noto-cjk

      # -----------------------------
      # 🐍 安装 Python 依赖
      # -----------------------------
      - name: 🐍 Install Python deps
        run: |
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      # -----------------------------
      # 🌐 Sing-box 代理缓存
      # -----------------------------
      - name: 🌐 Cache Sing-box
        uses: actions/cache@v4
        with:
          path: ~/.sing-box
          key: singbox-${{ runner.os }}
          restore-keys: |
            singbox-${{ runner.os }}

      - name: 🌐 Setup Sing-box proxy
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      # -----------------------------
      # 🚀 运行续期脚本
      # -----------------------------
      - name: 🚀 Run renew script
        env:
          JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
          JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      # -----------------------------
      # 🧹 清理旧运行记录
      # -----------------------------
      - name: 🧹 Cleanup old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done


       - name: Create keep-alive commit
        run: |
          echo "Last backup: $(date -u '+%Y-%m-%d %H:%M:%S UTC') | ID: $(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 8)" > keepalive.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.md || true

      - name: Commit & Push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "keepalive"
          file_pattern: keepalive.md
          push_options: '--force'
